<style>
/* ===== Dasar & warna ===== */
:root {
  --red:#C8102E;
  --blue:#12358C;
  --cream:#F4F6FB;
  --sand:#D8DEEA;
  --rose:#3E5EA8;
  --gold:#F0B400;
  --ink:#16213E
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font:16px/1.4 Archivo,system-ui,sans-serif
}
h1 {
  font-size:44px;
  line-height:1;
  font-weight:900;
  margin:0 0 12px;
  letter-spacing:-1px
}
h2 {
  font-weight:800
}
a {
  color:var(--rose);
  cursor:pointer;
  font-weight:600
}
.mut {
  opacity:.7
}
.err {
  color:var(--red);
  min-height:1.2em
}

/* ===== Halaman awal, form, kartu umum ===== */
.box {
  max-width:420px;
  margin:0 auto;
  padding:48px 22px
}
.pad {
  max-width:none;
  margin:0 auto;
  padding:16px
}
label {
  display:block;
  font-weight:600;
  font-size:14px;
  margin:12px 0
}
input {
  display:block;
  width:100%;
  margin-top:4px;
  padding:12px;
  border:1px solid var(--sand);
  border-radius:10px;
  background:#fff8ee;
  font:inherit;
  color:inherit
}
button {
  padding:12px 16px;
  border:1px solid var(--sand);
  border-radius:10px;
  background:#fff8ee;
  color:var(--ink);
  font:600 15px Archivo,sans-serif;
  margin:4px 4px 4px 0;
  cursor:pointer
}
button.pri {
  background:var(--gold);
  border-color:var(--gold)
}
.box button {
  width:100%;
  margin:8px 0
}
.card {
  background:#fff8ee;
  border:1px solid var(--sand);
  border-radius:12px;
  padding:12px 16px;
  margin:12px 0
}
.bar {
  display:flex;
  gap:12px;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  font-size:13px
}
details {
  border:1px solid var(--sand);
  border-radius:12px;
  padding:10px 14px;
  margin:12px 0
}
summary {
  font-weight:800;
  cursor:pointer
}
.fg {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0 12px
}
.hd {
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-weight:800;
  margin-top:8px
}
.hd b:first-child {
  color:var(--red)
}
.hd b:last-child {
  color:var(--blue);
  text-align:right
}
.jr {
  display:flex;
  align-items:center;
  gap:14px;
  background:#fff8ee;
  border:1px solid var(--sand);
  border-radius:12px;
  padding:10px 16px;
  margin:8px 0;
  font-weight:800
}
.jr span:first-child {
  flex:1
}
.n {
  font-size:34px;
  font-weight:900
}
.rd {
  color:var(--red)
}
.bl {
  color:var(--blue)
}
table {
  width:100%;
  border-collapse:collapse;
  margin:14px 0
}
th,td {
  padding:9px 6px;
  border-bottom:1px solid var(--sand);
  text-align:center
}
th:first-child,td:first-child {
  text-align:left;
  font-weight:800
}
.tot {
  display:flex;
  gap:12px
}
.tot div {
  flex:1;
  background:#fff8ee;
  border:1px solid var(--sand);
  border-radius:12px;
  padding:12px 16px
}
.tot b {
  display:block;
  font-size:32px;
  font-weight:900;
  color:var(--rose)
}
.tot div:last-child b {
  color:var(--ink)
}

/* ===== JURI (layar sentuh merah/biru) ===== */
#jd {
  position:fixed;
  inset:0;
  display:flex;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation
}
.half {
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  cursor:pointer
}
.half.rd {
  background:var(--red)
}
.half.bl {
  background:var(--blue)
}
.big {
  font-size:calc(34vmin*var(--fs,1));
  font-weight:900
}
.top {
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
  color:#fff;
  font-weight:800;
  pointer-events:none;
  text-shadow:0 1px 6px #0006
}
.cn,.mn {
  position:absolute;
  bottom:14px;
  border-radius:50%;
  width:54px;
  height:54px;
  padding:0;
  font-size:26px;
  background:#fff;
  border:3px solid #000
}
.cn.l {
  left:14px
}
.cn.r {
  right:14px
}
.mn {
  left:50%;
  transform:translateX(-50%);
  border-radius:30px;
  width:auto;
  padding:0 20px;
  height:44px;
  font-size:15px
}
#mnu,#ov {
  position:absolute;
  inset:0;
  background:#000d;
  color:#fff;
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  align-content:center;
  justify-content:center;
  padding:20px;
  text-align:center;
  font-weight:800;
  font-size:22px
}
#mnu button {
  width:130px;
  height:64px;
  background:#fff
}

/* ===== LOGO KECIL (admin, monitor, petugas waktu, juri) ===== */
.hlogo {
  height:30px;
  width:auto;
  flex:none;
  pointer-events:none;
  user-select:none
}
.hrow {
  display:flex;
  align-items:center;
  gap:8px
}
.jlogo {
  position:absolute;
  top:8px;
  left:10px;
  width:38px;
  height:auto;
  pointer-events:none;
  user-select:none;
  opacity:.9
}
/* ===== PETUGAS WAKTU MINIMALIS ===== */
.tm {
  max-width:560px;
  margin:0 auto
}
.tm .tot b {
  font-size:clamp(72px,22vw,120px) !important;
  line-height:1.05
}
.tm .tmx {
  text-align:center;
  margin:14px 0
}
.tm .tmb {
  display:block;
  width:100%;
  margin:0 0 12px;
  padding:20px 16px;
  font-size:22px;
  font-weight:800;
  border-radius:16px
}
.tm .tmb:disabled {
  opacity:.45
}
.tm .tml {
  display:block;
  text-align:center;
  font-size:13px;
  margin-top:6px;
  cursor:pointer
}
/* ===== LAYAR TV ===== */
#tvlogo {
  position:absolute;
  top:1.2vw;
  right:1.6vw;
  width:5.2vw;
  height:auto;
  z-index:66;
  pointer-events:none;
  user-select:none;
  opacity:.95
}
#tv {
  position:fixed;
  inset:0;
  background:linear-gradient(135deg,#0d1b45,#1b0f22 60%,#3b0d05);
  color:#fff;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:2vw 3vw;
  gap:1vw;
  line-height:1.1;
  overflow:hidden
}
#tv .logos {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:2.5vw;
  height:24vh;
  min-height:8vh;
  flex:0 1 auto
}
#tv .logos img {
  height:100%;
  min-width:0;
  max-width:100%;
  object-fit:contain;
  flex:0 1 auto
}
#tv h3 {
  margin:0;
  background:#000;
  text-align:center;
  font:italic 900 3.6vw/1.1 Archivo;
  padding:.6vw
}
.row {
  display:flex;
  align-items:center;
  gap:2vw;
  padding:1.1vw 3vw;
  font-weight:800;
  font-size:3.8vw;
  background:var(--red)
}
.row.b {
  background:var(--blue)
}
.row b {
  flex:0 0 9vw;
  width:9vw;
  text-align:center;
  font-size:3.6vw
}
.row span {
  flex:1;
  min-width:0;
  font-size:3.3vw;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}
.row .rr {
  display:flex;
  gap:1vw
}
.row .rr i {
  font-style:normal;
  text-align:center;
  width:6.5vw;
  background:#0004;
  border-radius:.6vw;
  padding:.3vw 0;
  font-size:4.4vw;
  font-weight:900
}
.row .rr small {
  display:block;
  font-size:1.4vw;
  opacity:.8;
  font-weight:600;
  letter-spacing:.1vw
}
.row .rr i small.tj {
  opacity:1;
  color:var(--gold);
  font-weight:800;
  font-size:1.3vw;
  margin-top:.2vw
}
.row em {
  font-style:normal;
  min-width:12vw;
  text-align:center;
  font-size:4.2vw;
  font-weight:900;
  border-radius:.8vw;
  padding:.2vw 0
}
.row em.w {
  background:var(--gold);
  color:var(--ink)
}
.foot {
  display:flex;
  justify-content:space-between;
  background:#1d1512;
  padding:1vw 4vw;
  font-weight:800;
  font-size:3.4vw;
  border-top:.4vw solid var(--gold)
}
.ck {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.6vw 3vw;
  background:#000a;
  border:.3vw solid var(--gold);
  color:var(--gold)
}
.ck .cl {
  font-weight:900;
  font-size:3.4vw;
  letter-spacing:.2vw
}
.ck .cl small {
  display:block;
  font-size:1.6vw;
  font-weight:600;
  opacity:.85;
  letter-spacing:0
}
.ck .cd {
  font-weight:900;
  font-size:8vw;
  line-height:1;
  font-variant-numeric:tabular-nums
}
.ck.lo .cd {
  color:#ff6a45;
  animation:bk 1s infinite
}
.ck.rs {
  border-color:#7be0b0;
  color:#7be0b0
}
.ck.rs.z .cd {
  animation:bk 1s infinite
}
@keyframes bk {
  0%,49% {
    opacity:1
  }
  50%,100% {
    opacity:.2
  }
}

/* ===== RESULT (cetak/PDF) ===== */
.doc {
  background:#fff;
  color:#000;
  width:900px;
  max-width:900px;
  min-width:900px;
  margin:0 auto;
  padding:20px;
  font-size:13px
}
.doc h4 {
  margin:2px;
  text-align:center
}
.doc .kop {
  display:flex;
  align-items:center;
  margin-bottom:8px
}
.doc .kop .kl,.doc .kop .kr {
  flex:1;
  display:flex;
  gap:8px
}
.doc .kop .kl {
  justify-content:flex-start
}
.doc .kop .kr {
  justify-content:flex-end
}
.doc .kop .kt {
  flex:1.4
}
.doc .kop img {
  height:56px;
  max-width:110px;
  object-fit:contain
}
.doc td,.doc th {
  border:1px solid #000;
  padding:5px;
  text-align:center
}
.doc table {
  table-layout:fixed
}
.doc th:first-child,.doc td:first-child {
  width:14%
}
.doc .idt th:nth-child(2),.doc .idt td:nth-child(2) {
  width:34%;
  text-align:left
}
.doc .idt th:nth-child(3),.doc .idt td:nth-child(3) {
  width:10%
}
.doc .sc th {
  font-size:10px;
  padding:5px 2px
}
.doc p {
  margin:4px 0
}
.doc .offs {
  display:grid;
  grid-template-columns:1fr;
  gap:2px;
  margin-top:10px
}
.sig {
  display:flex;
  justify-content:space-around;
  margin-top:16px;
  text-align:center
}
.sig div {
  height:80px
}
button:disabled {
  opacity:.4;
  cursor:default
}
[hidden] {
  display:none!important
}

/* ===== Credit / copyright ===== */
#cr {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  pointer-events: none;
  text-align: center;
  font-size: 11px;
  opacity: .6;
  padding: 4px 12px;
  background: transparent;
}
body.kiosk #cr {
  display: none
}
.jcr {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 2px;
  text-align: center;
  font-size: 9px;
  color: #fff;
  opacity: .35;
  pointer-events: none
}

/* ===== Tombol kembali di TV & lain-lain ===== */
.tvback {
  position:fixed;
  top:1vw;
  left:1vw;
  z-index:5;
  color:#fff;
  background:#000a;
  padding:.6vw 1.4vw;
  border-radius:2vw;
  font-size:1.6vw;
  opacity:.3;
  transition:opacity .2s
}
.tvback:hover {
  opacity:1
}
.lg {
  display:inline-block;
  text-align:center;
  margin:4px 8px 4px 0;
  background:#fff;
  border:1px solid var(--sand);
  border-radius:8px;
  padding:6px
}
.lg img {
  height:48px;
  display:block;
  margin-bottom:4px
}
#tv .logos:empty {
  display:none
}
#toast {
  position:fixed;
  bottom:16px;
  left:50%;
  transform:translateX(-50%);
  background:var(--ink);
  color:var(--cream);
  padding:10px 18px;
  border-radius:20px;
  display:none
}
/* ===== RESPONSIF: HP, iPad/tablet, laptop, monitor besar =====
   Tampilan non-TV (admin, monitor, petugas waktu, halaman awal) membesar bertahap mengikuti ukuran layar.
   Dua syarat (lebar DAN tinggi) dipakai supaya laptop berlayar pendek tidak jadi terlalu besar. */
html {
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%
}
.pad {
  padding-left:max(clamp(12px,2.2vw,40px),env(safe-area-inset-left));
  padding-right:max(clamp(12px,2.2vw,40px),env(safe-area-inset-right));
  padding-bottom:max(16px,env(safe-area-inset-bottom))
}
.pad table {
  display:block;
  max-width:100%;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch
}
img,video {
  max-width:100%
}
@media(min-width:768px) {
  .pad {
    padding-top:22px;
    zoom:1.1
  }
  .box {
    zoom:1.1
  }
}
@media(min-width:1100px) and (min-height:720px) {
  .pad {
    zoom:1.2
  }
  .box {
    zoom:1.25
  }
}
@media(min-width:1400px) and (min-height:860px) {
  .pad {
    zoom:1.35
  }
  .box {
    zoom:1.4
  }
}
@media(min-width:1800px) and (min-height:980px) {
  .pad {
    zoom:1.55
  }
  .box {
    zoom:1.6
  }
}
@media(max-width:520px) {
  .pad {
    padding-top:10px;
    padding-left:max(12px,env(safe-area-inset-left));
    padding-right:max(12px,env(safe-area-inset-right))
  }
  .box {
    padding:32px 16px
  }
  .bar {
    gap:8px
  }
}
@media(pointer:coarse) {
  button {
    min-height:44px
  }
  input,select,textarea {
    font-size:16px
  }
}
/* layar juri: tombol & teks ikut ukuran layar (HP kecil sampai iPad) */
.cn,.mn {
  width:clamp(54px,9vmin,92px);
  height:clamp(54px,9vmin,92px);
  bottom:max(14px,env(safe-area-inset-bottom));
  font-size:clamp(26px,4.6vmin,46px)
}
.mn {
  width:auto;
  height:clamp(44px,7vmin,72px);
  padding:0 clamp(14px,3vmin,30px);
  font-size:clamp(15px,2.6vmin,26px)
}
.top {
  top:max(10px,env(safe-area-inset-top));
  font-size:clamp(15px,3vmin,28px)
}
.jlogo {
  width:clamp(38px,7vmin,80px)
}
/* petugas waktu: ukuran mengikuti TINGGI layar (HP, iPad, laptop, monitor besar), bukan di-zoom */
.pad.tmpad {
  zoom:1 !important;
  max-width:none
}
.tmpad .bar {
  font-size:clamp(13px,1.9vh,20px)
}
.tmpad .hlogo {
  height:clamp(30px,4.4vh,52px)
}
.tm {
  max-width:none
}
.tm .card {
  font-size:clamp(15px,2.3vh,26px)
}
.tm .tot b {
  font-size:min(24vw,16vh) !important
}
.tm .tot span {
  font-size:clamp(14px,2.2vh,24px)
}
.tm .tmx button {
  font-size:clamp(15px,2.2vh,24px);
  padding:clamp(10px,1.4vh,18px) clamp(16px,2.4vh,30px)
}
.tm .tmb {
  padding:clamp(16px,2.6vh,32px) 16px;
  font-size:clamp(20px,3.2vh,36px)
}
.tm .tml {
  font-size:clamp(13px,1.8vh,20px)
}
/* ===== MENGISI LAYAR: kolom otomatis menyesuaikan lebar (admin, monitor, petugas waktu) ===== */
.pad.adm {
  display:block
}
@media(max-width:520px) {
  .jr {
    gap:6px;
    padding:10px
  }
  .jr button {
    padding:10px 12px;
    margin:0;
    min-width:40px
  }
}
.bd {
  display:block
}
.tm {
  display:block
}
.tm > div {
  min-width:0
}
/* ===== TAMBAH PARTAI + DAFTAR PARTAI (admin) ===== */
.qg {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));
  gap:0 10px
}
.qg label {
  margin:8px 0
}
.qw {
  overflow-x:auto;
  margin-top:8px
}
.pad .qt {
  display:table;
  width:100%;
  border-collapse:collapse
}
.qt th {
  text-align:left;
  font-size:13px;
  opacity:.65;
  padding:6px 8px;
  border-bottom:1px solid var(--sand)
}
.qt td {
  padding:8px;
  border-bottom:1px solid var(--sand);
  vertical-align:middle
}
.qt tr.on td {
  background:#fff3cf
}
.qt .qs {
  display:inline-block;
  padding:2px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:800;
  background:#eee6d6
}
.qt .qs.berjalan {
  background:var(--gold)
}
.qt .qs.selesai {
  opacity:.55
}
.qt button {
  margin:0 4px 0 0;
  padding:8px 12px
}
/* tabel riwayat ronde & total: selebar kotak di sekitarnya (tetap bisa digeser di layar sempit) */
.pad table.rt {
  display:table;
  width:100%;
  border-collapse:collapse
}
.rt th {
  font-size:clamp(14px,1.6vw,22px);
  padding:12px 8px;
  text-align:center
}
.rt td {
  font-size:clamp(15px,1.8vw,24px);
  padding:14px 8px;
  text-align:center;
  white-space:nowrap;
  border-bottom:1px solid var(--sand)
}
.rt th:first-child,.rt td:first-child {
  text-align:left;
  padding-left:14px
}
.rt td:last-child {
  font-weight:800
}
@media(max-width:520px) {
  .rt th {
    font-size:12px;
    padding:10px 3px
  }
  .rt td {
    font-size:13px;
    padding:12px 3px
  }
  .rt th:first-child,.rt td:first-child {
    padding-left:6px
  }
}
@media print {
  .noprint {
    display:none
  }
  body {
    background:#fff
  }
}
@media(max-width:520px) {
  h1 {
    font-size:36px
  }
  .fg {
    grid-template-columns:1fr
  }
}

<script>
/* =====================================================================
   PETA FILE  (Index.html = tampilan; Code.gs = server)
   ---------------------------------------------------------------------
   1. Variabel global & helper : call(), ad(), set(), leave(), toast()
   2. Halaman awal             : home, hist, join, mk, pickJ

const BUILD = 'daftar-2'; // penanda versi halaman; dilaporkan layar TV ke server supaya admin bisa melihat TV memakai versi yang mana
const SK = 'ms_sess';
const saved = () => { try { return JSON.parse(localStorage.getItem(SK) || 'null'); } catch (e) { return null; } };
function forget() { try { localStorage.removeItem(SK); } catch (e) {} home(); }
function resume() {
    const x = saved();
    if (!x) return home();
    S = x;
    if (S.role == 'juri' && !S.j) pickJ(); else start();
}
window.addEventListener('popstate', () => { if (on) leave(home); });
function start() {
    if (!S.tmp) { try { localStorage.setItem(SK, JSON.stringify(S)); } catch (e) {} }
    history.pushState({ app: 1 }, '');
    on = 1;
    clearInterval(T);
    clearInterval(TT);
    const R = S.role;
    if (R == 'admin')
        admin();
    else if (R == 'monitor')
        A.innerHTML = `<div class=pad><div class=bar><span class=hrow><img class=hlogo alt="" src="${GSM_LOGO}"><b>Monitor dewan juri</b></span>${BK}</div><div id=live></div></div>`;
    else if (R == 'tv')
        A.innerHTML = '<div id=tv><img id=tvlogo alt="" src="' + GSM_LOGO + '"><a class=tvback onclick=leave(home)>‹ Kembali</a><div class=logos id=lgs></div><div id=tvb style="display:contents"></div></div>';
    else if (R == 'timer')
        A.innerHTML = `<div class="pad tmpad"><div class=bar><span class=hrow><img class=hlogo alt="" src="${GSM_LOGO}"><b>Petugas waktu</b></span>${BK}</div><div id=tmr></div></div>`;
    else
        judge();
    tick();
    T = setInterval(tick, R == 'juri' ? 2500 : (R == 'timer' || R == 'tv') ? 1000 : 1500);
    if (R == 'tv') {
        TT = setInterval(tvClock, 250);
        $('#tv').ondblclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {}); // klik dua kali = layar penuh
    }
}
async function tick() {
    const r = await call({ a: 'get', c: S.c, pin: S.pin, ...(S.role == 'tv' ? { v: BUILD } : {}) });
    if (!on)
        return;
    if (r.err) {
        S.role != 'tv' && dbg('Server: ' + r.err);
        return;
    }
    set(r);
    paint();
}
function paint() {
    try {
        if (S.role == 'admin')
            padmin();
        else if (S.role == 'monitor')
            $('#live').innerHTML = board(st);
        else if (S.role == 'tv')
            ptv();
        else if (S.role == 'timer')
            ptimer();
        else
            pj();
        dbg('');
    }
    catch (e) {
        console.error(e);
        S.role != 'tv' && dbg('Error tampilan: ' + e.message);
    }
}
const tl = s => s.pLeft ? Math.ceil(s.pLeft / 1000) : Math.max(0, Math.ceil((s.tEnd - Date.now() - s.sk) / 1000)); /* sisa detik ronde; pLeft = waktu sedang dihentikan */
function timer(s) {
    if (!s.tEnd || s.done[s.round])
        return '';
    const l = tl(s);
    return `${Math.floor(l / 60)}:${String(l % 60).padStart(2, '0')}`;
}
function fmt(n) {
    n = Math.max(0, n | 0);
    return `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
}
function rleft(s) {
    return s.rEnd ? Math.max(0, Math.ceil((s.rEnd - Date.now() - s.sk) / 1000)) : -1;
} /* sisa detik istirahat, -1 = tidak istirahat */
function clk(s) {
    const d = s.done[s.round], rn = s.round, rl = rleft(s);
    if (rl >= 0)
        return {
            lab: rl ? 'ISTIRAHAT' : 'ISTIRAHAT SELESAI', sub: rn < 3 ? 'Menuju ronde ' + (rn + 1) : '', dig: fmt(rl), c: rl ? 'rs' : 'rs z'
        };
    if (s.tEnd && !d) {
        const l = tl(s);
        return {
            lab: 'RONDE ' + rn, sub: s.pLeft ? 'WAKTU DIHENTIKAN' : '', dig: fmt(l), c: l <= 10 ? 'lo' : ''
        };
    }
    if (d)
        return {
            lab: 'RONDE ' + rn, sub: 'Selesai', dig: '0:00', c: ''
        };
    return {
        lab: 'RONDE ' + rn, sub: 'Siap dimulai', dig: fmt(s.dur), c: ''
    };
}

/* ---------- PETUGAS WAKTU ---------- */

function tmNext() { // ronde berikutnya; kalau ronde belum ditutup, ditutup (disimpan + dikunci) dulu
    const s = st, d = s.done[s.round];
    if (!d) {
        if (s.tEnd && (s.pLeft || tl(s) > 0) && !confirm('Waktu ronde belum habis. Akhiri ronde sekarang dan pindah ke ronde berikutnya?'))
            return;
        return ad({ a: 'end' }).then(() => ad({ a: 'next' }, 'Pindah ke ronde berikutnya'));
    }
    return ad({ a: 'next' }, 'Pindah ke ronde berikutnya');
}
function ptimer() { // tampilan minimalis: 1 tombol utama (Mulai / Stop / Lanjutkan), Ronde berikutnya, Mulai istirahat
    const s = st, d = s.done[s.round], run = s.tEnd && !d, b = s.bout, rl = rleft(s), rr = rl >= 0, paused = !!s.pLeft;
    const up = run && !paused && tl(s) == 0; // waktu ronde sudah habis
    let m = { t: 'Mulai', a: 'start', msg: 'Ronde dimulai', off: !!(d || rr), pri: true };
    if (run && !paused)
        m = { t: 'Stop', a: 'pause', msg: 'Waktu dihentikan', off: rr || up, pri: false };
    else if (run && paused)
        m = { t: 'Lanjutkan', a: 'resume', msg: 'Waktu dilanjutkan', off: rr, pri: true };
    const nextOff = s.round >= 3 || rr || (!d && !run);
    const restOn = rr || ((d || up) && s.round < 3);
    $('#tmr').innerHTML = `<div class=tm><div><div class=card><b>${esc(s.name)}</b><br>${b.no ? 'Partai ' + esc(b.no) + ' · ' : ''}Ronde ${s.round} dari 3${d ? ' (selesai)' : ''}</div>
 <div class=tot style="text-align:center"><div><b style="display:block">${rr ? fmt(rl) : run ? timer(s) : fmt(s.dur)}</b><span class=mut>${rr ? (rl ? 'Istirahat berjalan' : 'Istirahat selesai') : run ? (paused ? 'Waktu dihentikan' : up ? 'Waktu habis' : 'Berjalan') : d ? 'Ronde selesai' : 'Belum dimulai'}</span></div></div>
 </div><div><div class=tmx><button onclick="ad({a:'${rr ? 'radj' : 'adj'}',d:-10})" ${rr || run ? '' : 'disabled'}>−10 dtk</button> <button onclick="ad({a:'${rr ? 'radj' : 'adj'}',d:10})" ${rr || run ? '' : 'disabled'}>+10 dtk</button></div>
 <button class="tmb ${m.pri ? 'pri' : ''}" onclick="ad({a:'${m.a}'},'${m.msg}')" ${m.off ? 'disabled' : ''}>${m.t}</button>
 <button class=tmb onclick="tmNext()" ${nextOff ? 'disabled' : ''}>Ronde berikutnya</button>
 <button class=tmb onclick="ad({a:'${rr ? 'rstop' : 'rest'}'},'${rr ? 'Istirahat dihentikan' : 'Istirahat dimulai'}')" ${restOn ? '' : 'disabled'}>${rr ? 'Stop istirahat' : 'Mulai istirahat'}</button>
 ${d && !rr ? '<a class="tml mut" onclick="ad({a:\'reopen\'},\'Kunci dibuka\')">Salah pencet? Buka kunci ronde</a>' : ''}</div></div>`;
}
function board(s) {
    const c = s.calc, b = s.bout, cur = s.round;
    let h = `<div class=hd><b>${esc(b.red.n) || 'Sudut merah'}</b><span>${b.no ? 'Partai ' + esc(b.no) : ''}</span><b>${esc(b.blue.n) || 'Sudut biru'}</b></div><div class=bd><div><p class=mut>Ronde ${cur} ${s.done[cur] ? 'selesai' : timer(s)}${rleft(s) >= 0 ? ' · Istirahat ' + fmt(rleft(s)) : ''}</p>`;
    for (let j = 0; j < 5; j++) {
        const v = c.rounds[cur].J[j].raw;
        h += `<div class=jr><span>Juri ${j + 1}</span><span class="rd n">${v[0]}</span><span>–</span><span class="bl n">${v[1]}</span></div>`;
    }
    h += `</div><div><p class=mut>Riwayat semua ronde dan total</p><div class=qw><table class=rt><tr><th>Ronde<th>J1<th>J2<th>J3<th>J4<th>J5<th>Skor</tr>`;
    for (let r = 1; r <= 3; r++) {
        const R = c.rounds[r];
        const pn = R.pot[0] || R.pot[1] ? ` <span class=mut style="font-size:11px">(potongan ${R.pot.join('-')})</span>` : '';
        h += `<tr><td>Ronde ${r}` + R.J.map(x => `<td>${x.raw[0] + x.raw[1] ? x.raw.join('-') : '–'}`).join('') + `<td><b>${s.done[r] ? R.s.join('-') : '–'}</b>${s.done[r] ? pn : ''}</tr>`;
    }
    return h + `</table></div><div class=tot><div>Total mentah<b>${c.mentah.join(' - ')}</b></div><div>Skor akhir<b>${c.tot.join(' - ')}</b></div></div></div></div>`;
}

async function loadHist() {

}

                    c.width = Math.round(im.width * k);

}

async function tvVid(slot) { // layar TV mengunduh video di latar belakang supaya siap diputar (3 potongan paralel, ulang per potongan)
    const m = st.vv && st.vv[slot], x = TVV[slot];
    if (!m) {
        if (x.url) {

            x.url = '';

    }
    if (x.v == m.v || x.busy || Date.now() < x.fail)
        return;
    x.busy = 1;
    x.p = 0;
    x.n = m.n;
    try {
        const parts = new Array(m.n);
        let next = 0;
        const worker = async () => {
            while (next < m.n) {
                const i = next++;
                let ok = 0;

                        for (let k = 0; k < bin.length; k++)
                            u[k] = bin.charCodeAt(k);
                        parts[i] = u;
                        x.p++;
                        ok = 1;
                    } else
                        await new Promise(z => setTimeout(z, 1500));
                }
                if (!ok)
                    throw new Error('potongan ' + i + ' gagal');
            }
        };
        await Promise.all([worker(), worker(), worker()]);
        if (x.url)
            URL.revokeObjectURL(x.url);
        x.url = URL.createObjectURL(new Blob(parts, { type: m.type || 'video/mp4' }));
