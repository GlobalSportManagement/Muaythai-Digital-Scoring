<style>

/* ===== RESULT (cetak/PDF) ===== */

</style></head><body><div id="app"></div><div id="toast"></div><footer id="cr" class="noprint"></footer>
<script>
/* =====================================================================
   PETA FILE  (Index.html = tampilan; Code.gs = server)
   ---------------------------------------------------------------------
   1. Variabel global & helper : call(), ad(), set(), leave(), toast()
   2. Halaman awal             : home, hist, join, mk, pickJ
   3. start() / tick() / paint(): memilih layar sesuai peran (role)
   4. Petugas waktu            : ptimer
   5. Monitor + papan skor     : board
   6. Admin                    : admin, padmin, sv, logo
   7. Juri                     : judge, tap, un
   8. Layar TV                 : ptv, tvClock
   9. Result (cetak/PDF)       : result

   ATURAN TAMBAH FITUR (supaya layar tidak blank):
   - Tambah 1 fitur per kali, lalu uji. Jangan menulis ulang seluruh file.
   - Jangan ganti nama S, st, call, ad, paint, start, home, join, leave.
   - Aksi ke server: ad({a:'namaAksi', ...}). Nama aksi yang sama harus
     ada di act_() pada Code.gs.
   - Tombol kembali: pakai leave(join) atau leave(home).
   - Jika layar blank, lihat banner merah di atas layar (isi pesan error).
   ===================================================================== */
const $ = q => document.querySelector(q), A = $('#app');
let S = null, T = 0, TT = 0, st = null, mine = [0, 0], pend = 0, fs = 1, brk = 0, filled = 0, NEW = null, LG = [], lgv = -1, tvLv = -1, on = 0;
/* GANTI ini dengan URL Web App (yang berakhiran /exec) dari Deploy > Manage deployments di Apps Script kamu */
const EXEC_URL = 'https://script.google.com/macros/s/AKfycbx7vz6mVs6of44TsG6-5Qk3JjAT8f_H8wK7jkuCj_P6l5n2cVmmqfSieL_QlxeLMhxH/exec';
const call = p => fetch(EXEC_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) })
    .then(r => r.json())
    .catch(e => ({ err: 'Gagal menghubungi server: ' + e.message }));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
}[c]));
const toast = t => {
    const e = $('#toast');
    e.textContent = t;
    e.style.display = 'block';
    setTimeout(() => e.style.display = 'none', 1800);
};
const dbg = t => {
    let e = $('#dbg');
    if (!e) {
        e = document.createElement('div');
        e.id = 'dbg';
        e.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#C8102E;color:#fff;font:600 12px Archivo,sans-serif;padding:5px 10px;z-index:100;text-align:center';
        document.body.appendChild(e);
    }
    e.textContent = t;
    e.hidden = !t;
};
const set = r => {
    r.sk = r.now - Date.now();
    st = r;
};
const leave = f => {
    on = 0;
    clearInterval(T);
    clearInterval(TT);
    document.body.classList.remove('kiosk');
    f();
};
const BK = '<span><a onclick=leave(join)>‹ Kembali</a> · <a onclick=home()>Keluar</a></span>';
const ad = async (p, m) => {
    const r = await call({ c: S.c, pin: S.pin, ...p });
    if (r.err)
        return toast(r.err);
    if (!on)
        return;
    set(r);
    paint();
    if (m)
        toast(typeof m == 'function' ? m(r) : m);
};
function ask(m, f) {
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:99;padding:20px';
    d.innerHTML = `<div class=card style="max-width:340px;text-align:center"><p>${m}</p>${f ? '<button id=ka>Batal</button>' : ''}<button class=pri id=ky>${f ? 'Ya' : 'OK'}</button></div>`;
    document.body.appendChild(d);
    const x = () => d.remove();
    d.querySelector('#ky').onclick = () => {
        x();
        f && f();
    };
    if (f)
        d.querySelector('#ka').onclick = x;
}
function home() {
    on = 0;
    clearInterval(T);
    clearInterval(TT);
    document.body.classList.remove('kiosk');
    if (!window.warm) {
        window.warm = 1;
        call({ a: 'ping' });
    }
    A.innerHTML = `<main class=box><h1>Muaythai<br>Digital Scoring</h1><button class=pri onclick=join()>Gabung hari pertandingan</button><button onclick=mk()>Buat event baru</button><button onclick=hist()>Riwayat event</button></main>`;
}
async function hist() {
    A.innerHTML = `<main class=box><a onclick=home()>‹ Kembali</a><h2>Riwayat event</h2><div id=hl class=mut>Memuat...</div></main>`;
    const L = await call({ a: 'events' });
    $('#hl').innerHTML = L && L.length ? L.map(e => `<div class=card style="cursor:pointer" onclick="joinCode('${e.code}')"><b>${esc(e.name)}</b><br><span class=mut>Kode ${e.code}${e.venue ? ' · ' + esc(e.venue) : ''}</span></div>`).join('') : '<p class=mut>Belum ada event.</p>';
}
function joinCode(c) {
    join();
    $('#c').value = c;
    $('#p').focus();
}
function join() {
    A.innerHTML = `<main class=box><a onclick=home()>‹ Kembali</a><h2>Gabung hari pertandingan</h2><label>Kode event<input id=c inputmode=numeric placeholder="cth. 4821"></label><label>PIN<input id=p type=password placeholder="PIN Admin, Juri, Monitor, atau TV"></label><p id=e class=err></p><button class=pri onclick=go()>Gabung</button></main>`;
}
async function go() {
    const c = $('#c').value.trim(), pin = $('#p').value.trim(), r = await call({ a: 'get', c, pin });
    if (r.err)
        return $('#e').textContent = r.err;
    S = { c, pin, role: r.role };
    if (r.role == 'juri') pickJ();
    else {
        start();
        set(r);
        paint();
    }
}
function pickJ() {
    A.innerHTML = `<main class=box><a onclick=join()>‹ Kembali</a><h2>Kamu juri nomor berapa?</h2>${[1, 2, 3, 4, 5].map(n => `<button onclick="S.j=${n};start()">Juri ${n}</button>`).join('')}</main>`;
}
function mk() {
    A.innerHTML = `<main class=box><a onclick=home()>‹ Kembali</a><h2>Buat event baru</h2><label>Nama event<input id=n placeholder="cth. Indonesia Muaythai Championship"></label><button class=pri onclick=cr()>Buat event</button><div id=out></div></main>`;
}
async function cr() {
    $('#out').innerHTML = '<p class=mut>Membuat event... (pertama kali bisa beberapa detik)</p>';
    const r = await call({ a: 'new', name: $('#n').value });
    if (!r || r.err || !r.pins)
        return $('#out').innerHTML = `<p class=err>Gagal membuat event: ${esc(r && r.err || 'server tidak membalas')}</p>`;
    NEW = r;
    const p = r.pins;
    $('#out').innerHTML = `<div class=card>Kode event <b>${r.code}</b><br>PIN admin <b>${p.admin}</b><br>PIN juri <b>${p.juri}</b><br>PIN monitor dewan juri <b>${p.monitor}</b><br>PIN layar TV <b>${p.tv}</b><br>PIN petugas waktu <b>${p.timer}</b></div><p class=mut>Catat PIN ini. Admin bisa melihatnya lagi di dashboard.</p><button class=pri onclick="S={c:NEW.code,pin:NEW.pins.admin,role:'admin'};start()">Masuk sebagai admin</button>`;
}
function start() {
    on = 1;
    clearInterval(T);
    clearInterval(TT);
    const R = S.role;
    if (R == 'admin')
        admin();
    else if (R == 'monitor')
        A.innerHTML = `<div class=pad><div class=bar><b>Monitor dewan juri</b>${BK}</div><div id=live></div></div>`;
    else if (R == 'tv')
        A.innerHTML = '<div id=tv><a class=tvback onclick=leave(join)>‹ Kembali</a><div class=logos id=lgs></div><div id=tvb style="display:contents"></div></div>';
    else if (R == 'timer')
        A.innerHTML = `<div class=pad><div class=bar><b>Petugas waktu</b>${BK}</div><div id=tmr></div></div>`;
    else
        judge();
    tick();
    T = setInterval(tick, R == 'juri' ? 2500 : (R == 'timer' || R == 'tv') ? 1000 : 1500);
    if (R == 'tv')
        TT = setInterval(tvClock, 250);
}
async function tick() {
    const r = await call({ a: 'get', c: S.c, pin: S.pin });
    if (!on)
        return;
    if (r.err) {
        S.role != 'tv' && dbg('Server: ' + r.err);
        return;
    }
    set(r);
    paint();
}
function paint() {
    try {
        if (S.role == 'admin')
            padmin();
        else if (S.role == 'monitor')
            $('#live').innerHTML = board(st);
        else if (S.role == 'tv')
            ptv();
        else if (S.role == 'timer')
            ptimer();
        else
            pj();
        dbg('');
    }
    catch (e) {
        console.error(e);
        S.role != 'tv' && dbg('Error tampilan: ' + e.message);
    }
}
function timer(s) {
    if (!s.tEnd || s.done[s.round])
        return '';
    const l = Math.max(0, Math.ceil((s.tEnd - Date.now() - s.sk) / 1000));
    return `${Math.floor(l / 60)}:${String(l % 60).padStart(2, '0')}`;
}
function fmt(n) {
    n = Math.max(0, n | 0);
    return `${Math.floor(n / 60)}:${String(n % 60).padStart(2, '0')}`;
